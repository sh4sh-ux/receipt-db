<!DOCTYPE html>

<title>영수증 보관함</title>
<meta name="theme-color" id="themeColorMeta" content="#111213"/>
<meta name="apple-mobile-web-app-title" content="영수증"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="mobile-web-app-capable" content="yes"/>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<script>
(()=>{
  let preference='system';
  try{preference=localStorage.getItem('receiptDbTheme')||'system';}catch(e){}
  const dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  const resolved=preference==='system'?(dark?'dark':'light'):preference;
  document.documentElement.dataset.theme=resolved;
  document.documentElement.dataset.themePreference=preference;

  // 홈 화면에 추가한 앱(standalone)인지 첫 페인트 전에 표시해 둔다.
  // standalone에서는 내용이 상태바 아래로 깔리는데 iOS가 env(safe-area-inset-top)을
  // 0으로 주는 경우가 있어, CSS에서 최소 여백을 따로 깔기 위한 신호다.
  // navigator.standalone은 iOS 전용, display-mode는 그 외 브라우저용.
  try{
    const standalone = window.navigator.standalone === true
      || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    if(standalone) document.documentElement.classList.add('is-standalone');
  }catch(e){}
})();

/* 모바일에서 '문서 자체'가 밀리는 것을 되돌린다.
   html/body가 overflow:hidden 이라 한번 밀리면 손가락으로는 되돌릴 수 없고,
   헤더가 상태바 아래로 들어간 채 남는다.
   iOS는 입력칸을 키보드 위로 올리려고 문서를 스크롤하므로,
   타이핑 중에는 그 위치를 존중하고 입력이 끝나면 제자리로 돌린다. */
(()=>{
  const 모바일 = () => window.innerWidth <= 780;
  const 타이핑중 = () => {
    const el = document.activeElement;
    return !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
  };
  const 되돌리기 = () => {
    if (!모바일() || 타이핑중()) return;
    if (window.scrollY || document.documentElement.scrollTop || document.body.scrollTop) {
      window.scrollTo(0, 0);
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
    }
  };
  addEventListener('scroll', 되돌리기, {passive:true});
  addEventListener('resize', 되돌리기);
  addEventListener('orientationchange', () => setTimeout(되돌리기, 120));
  // 입력이 끝난 뒤(키보드 내려간 뒤) 확실히 제자리로
  addEventListener('focusout', () => setTimeout(되돌리기, 60), true);
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', () => setTimeout(되돌리기, 60));
  }
})();
</script>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{

  --sep2:#2a2d30;
  --fill:#252729;
  --fill2:#2d3033;
  --blue:#6264ee;
  --blue-bg:rgba(98,100,238,.15);
  --blue-txt:#7c7ef5;
  --green:#34c97d;
  --green-bg:rgba(52,201,125,.12);
  --green-txt:#34c97d;
  --red:#ff5252;
  --red-bg:rgba(255,82,82,.1);
  --amber:#f6ad55;
  --amber-bg:rgba(246,173,85,.12);
  --nav-bg:#0D0E11;

  --app-shadow:0 24px 64px rgba(0,0,0,.28),0 4px 16px rgba(0,0,0,.14);
  --soft-shadow:0 1px 2px rgba(0,0,0,.18);
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#F7F7F8;
  --card:#fff;
  --left-bg:#FAFAFA;
  --label:#111;
  --label2:#666;
  --label3:#B0B0B8;
  --sep:#EBEBED;
  --sep2:#D4D4D8;
  --fill:#F3F3F5;
  --fill2:#F8F8FA;
  --blue:#4355E8;
  --blue-bg:#EEEFFE;
  --blue-txt:#2636B8;
  --green:#1DAD53;
  --green-bg:#EDFAF3;
  --green-txt:#13823D;
  --red:#E53E3E;
  --red-bg:#FFF0F0;
  --amber:#FF9500;
  --amber-bg:#FFF5E6;
  --nav-bg:#F1F2F6;
  --app-shadow:0 24px 70px rgba(25,28,38,.12),0 3px 14px rgba(25,28,38,.06);
  --soft-shadow:0 1px 3px rgba(25,28,38,.06);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111113;
  --card:#2C2C2E;
  --left-bg:#1C1C1E;
  --label:#F2F2F7;
  --label2:#AEAEB2;
  --label3:#636366;

  --sep2:#48484A;
  --fill:#3A3A3C;
  --fill2:#222224;
  --blue:#7080F5;
  --blue-bg:#1A1E4A;
  --blue-txt:#A5B0FF;
  --green:#30D158;
  --green-bg:#0C2818;
  --green-txt:#32D75A;
  --red:#FF453A;
  --red-bg:#2E1414;

}
html,body{background:var(--bg);font-family:-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif;font-size:14px;color:var(--label);min-height:100vh;-webkit-font-smoothing:antialiased;}
input,select,button,textarea{font-family:inherit;color:inherit;}
button{cursor:pointer;}
svg{display:block;flex-shrink:0;}
.amt-neg{color:var(--red);}

/* ── SHELL ── */
.shell{max-width:1540px;margin:0 auto;padding:30px 28px 84px;}
.app{background:var(--card);border-radius:22px;border:1px solid var(--sep);overflow:clip;box-shadow:var(--app-shadow);min-height:780px;display:grid;grid-template-columns:76px 360px minmax(0,1fr);}

/* ── ICON NAV ── */
/* ⚠️ z-index 필수 — 레일과 .side가 둘 다 positioned + z-index:auto 라
   DOM상 뒤에 오는 .side가 위에 그려져 말꼬리가 가렸다.
   #viewList>.main-top(z-index:70)보다도 위여야 한다. */
.icon-nav{background:var(--nav-bg);border-right:1px solid var(--sep);display:flex;flex-direction:column;align-items:center;padding:20px 10px;gap:10px;position:sticky;top:0;z-index:100;height:calc(100vh - 30px);max-height:100vh;align-self:start;}
.nav-brand{width:48px;height:48px;border:0;outline:0;appearance:none;-webkit-appearance:none;border-radius:15px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;letter-spacing:-.4px;margin-bottom:12px;box-shadow:0 8px 24px color-mix(in srgb,var(--blue) 28%,transparent);transition:transform .15s,filter .15s;flex-shrink:0;}
.nav-brand:hover{filter:brightness(1.06);transform:translateY(-1px);}
.nav-brand:active{transform:scale(.95);}
.nav-btn{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--label3);cursor:pointer;transition:background .15s,color .15s,transform .15s;border:1px solid transparent;background:transparent;flex-shrink:0;}
.icon-nav .nav-btn:hover{background:var(--fill2);color:var(--label2);transform:translateY(-1px);}
/* ⚠️ .icon-nav 를 반드시 붙일 것 — 이 버튼들은 .tab 클래스도 갖고 있어서
   뒤에 오는 .tab.on(background:var(--card))에 같은 우선순위로 밀린다. */
.icon-nav .nav-btn.on{background:var(--blue-bg);color:var(--blue-txt);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--blue) 28%,transparent);}
.nav-btn:active{transform:scale(.94);}
.nav-btn:focus-visible{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg);}
.nav-btn svg{width:22px;height:22px;}
.nav-mobile-label{display:none;}
.icon-nav .nav-btn.tab{flex:0 0 48px;padding:0;}
.nav-spacer{flex:1;min-height:28px;}
.icon-nav [data-nav-label]{position:relative;}
/* 말꼬리 — 더치페이(.app-rail)와 동일한 값. 반투명+블러라 뒤 내용이 비치고,
   레일 바로 옆(2px)에 붙어 좌측 패널 콘텐츠 시작선을 넘지 않는다. */
.icon-nav [data-nav-label]::after{content:attr(data-nav-label);position:absolute;z-index:400;left:calc(100% + 2px);top:50%;transform:translateY(-50%) translateX(-3px);padding:5px 8px;border-radius:7px;background:rgba(36,36,38,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font-size:11.5px;font-weight:600;line-height:1;letter-spacing:-.1px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.16);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s,transform .12s,visibility .12s;}
.icon-nav [data-nav-label]:hover::after,.icon-nav [data-nav-label]:focus-visible::after,.icon-nav [data-nav-label].show-nav-tip::after{opacity:1;visibility:visible;transform:translateY(-50%) translateX(0);}

/* ── LEFT SIDEBAR ── */
.side{border-right:1px solid var(--sep);background:var(--left-bg);display:flex;flex-direction:column;min-height:700px;position:sticky;top:0;max-height:100vh;overflow:hidden;}
.side-title-row{display:flex;align-items:center;justify-content:flex-start;margin-bottom:8px;}
.side-title{font-size:20px;font-weight:700;letter-spacing:-.3px;}
.side-top{padding:26px var(--pad-x) 18px;}
.app-eye-row{display:flex;align-items:center;gap:7px;margin-bottom:4px;}
.app-eye{font-size:11px;font-weight:600;color:var(--label3);letter-spacing:.5px;text-transform:uppercase;}
.app-version{font-size:10px;font-weight:600;color:var(--label3);background:transparent;border:1px solid transparent;border-radius:4px;padding:1px 2px;letter-spacing:.2px;font-variant-numeric:tabular-nums;line-height:1.4;cursor:default;}
.app-version:hover{background:transparent;color:var(--label2);}
.app-title{font-size:22px;font-weight:700;letter-spacing:-.4px;line-height:1.15;margin-bottom:14px;cursor:pointer;transition:opacity .12s;user-select:none;}
.app-title:hover{opacity:.65;}
.tab-row{display:flex;gap:2px;background:var(--fill);border-radius:10px;padding:3px;}
.tab{flex:1;border:none;background:transparent;font-size:13px;font-weight:500;color:var(--label2);padding:7px 0;border-radius:8px;cursor:pointer;transition:all .15s;}
.tab.on{background:var(--card);color:var(--label);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08);}

.side-search{padding:12px var(--pad-x) 14px;}
.search-wrap{position:relative;}
.search-wrap input{width:100%;border:1px solid var(--sep2);border-radius:var(--rs);padding:8px 30px 8px 32px;font-size:13px;background:var(--card);color:var(--label);outline:none;}
.search-wrap input:focus{border-color:var(--blue);}
.search-wrap > svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--label3);}
.search-clear{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:20px;height:20px;border:none;background:transparent;border-radius:50%;color:var(--label3);display:flex;align-items:center;justify-content:center;padding:0;opacity:0;pointer-events:none;cursor:pointer;transition:opacity .15s,background .12s,color .12s;flex-shrink:0;}
.search-clear.vis{opacity:1;pointer-events:auto;}
.search-clear:hover{background:var(--sep2);color:var(--label2);}

.side-list{flex:1;overflow-y:auto;padding-bottom:8px;}
.side-list::-webkit-scrollbar{width:3px;}
.side-list::-webkit-scrollbar-thumb{background:var(--sep2);border-radius:2px;}
