name: Patch Receipt DB Dropbox reconnect flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/receipt-rules-v251.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch Dropbox reconnect and legacy scan path handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          text = text.replace("const APP_VERSION='v2.67';", "const APP_VERSION='v2.68';")

          if 'function _dbxNormalizeLegacyScanDir(){' not in text:
              anchor = """function _dbxScanDirDefault(){return _DBX_DATA_DIR+'/스캔함';}\nfunction _dbxScanDir(){\n  let v=_ls(_K.SCAN_DIR)||_dbxScanDirDefault();\n  v=String(v).trim().replace(/\\\\/g,'/').replace(/\\/+$/,'');   // 끝 슬래시 제거\n  if(!v)v=_dbxScanDirDefault();\n  if(!v.startsWith('/'))v='/'+v;\n  return v;\n}\n"""
              replacement = """function _dbxScanDirDefault(){return _DBX_DATA_DIR+'/스캔함';}\nfunction _dbxNormalizeLegacyScanDir(){\n  try{\n    const raw=_ls(_K.SCAN_DIR);\n    if(!raw)return;\n    const v=String(raw).trim().replace(/\\\\/g,'/').replace(/\\/+$/,'');\n    if(!v){_lsDel(_K.SCAN_DIR);return;}\n    if(v===_DBX_OLD_ROOT+'/스캔함'){_lsDel(_K.SCAN_DIR);return;}\n    if(v.startsWith(_DBX_OLD_ROOT+'/')){\n      _lsSet(_K.SCAN_DIR,_DBX_ROOT+v.slice(_DBX_OLD_ROOT.length));\n    }\n  }catch(e){}\n}\nfunction _dbxScanDir(){\n  _dbxNormalizeLegacyScanDir();\n  let v=_ls(_K.SCAN_DIR)||_dbxScanDirDefault();\n  v=String(v).trim().replace(/\\\\/g,'/').replace(/\\/+$/,'');   // 끝 슬래시 제거\n  if(!v)v=_dbxScanDirDefault();\n  if(!v.startsWith('/'))v='/'+v;\n  return v;\n}\n"""
              if anchor not in text:
                  raise SystemExit('SCAN_DIR_ANCHOR_NOT_FOUND')
              text = text.replace(anchor, replacement, 1)

          old_phone = """async function _dbxCopyPhoneLink(){\n  const key=_ls(_K.APP_KEY);\n  if(!key){toast('App Key가 없어요',{type:'error'});return;}\n  const url=location.origin+location.pathname+'#k='+key;\n  try{\n    await navigator.clipboard.writeText(url);\n    toast('링크를 복사했어요 — 폰으로 보내서 열면 연결됩니다',{type:'success',duration:5000});\n  }catch(e){\n    prompt('이 링크를 폰으로 보내 열어 주세요',url);\n  }\n}\n"""
          new_phone = """async function _dbxCopyPhoneLink(){\n  const key=_ls(_K.APP_KEY);\n  if(!key){toast('App Key가 없어요',{type:'error'});return;}\n  const url=location.origin+location.pathname+'#k='+key;\n  try{\n    if(navigator.share){\n      await navigator.share({title:'Receipt DB Dropbox 연결',text:'이 링크를 열면 App Key 입력 없이 Dropbox 연결을 시작합니다.',url});\n      toast('연결 링크를 보냈어요',{type:'success',duration:5000});\n      return;\n    }\n  }catch(e){\n    if(e&&e.name==='AbortError')return;\n  }\n  try{\n    await navigator.clipboard.writeText(url);\n    toast('링크를 복사했어요 — 폰으로 보내서 열면 연결됩니다',{type:'success',duration:5000});\n  }catch(e){\n    const picked=prompt('복사가 막혔어요. 아래 링크를 길게 눌러 복사하거나 그대로 보내 주세요.',url);\n    if(picked)toast('링크를 확인했어요',{type:'success',duration:3500});\n  }\n}\n"""
          if old_phone in text:
              text = text.replace(old_phone, new_phone, 1)
          elif 'navigator.share({title:' not in text:
              raise SystemExit('PHONE_LINK_ANCHOR_NOT_FOUND')

          init_anchor = """  const avs=document.getElementById('appVersionStat');if(avs)avs.textContent=APP_VERSION;\n  const pm=document.getElementById('printMonth');if(pm&&!pm.value)pm.value=viewMonth;\n"""
          init_replacement = """  const avs=document.getElementById('appVersionStat');if(avs)avs.textContent=APP_VERSION;\n  _dbxNormalizeLegacyScanDir();\n  const pm=document.getElementById('printMonth');if(pm&&!pm.value)pm.value=viewMonth;\n"""
          if '_dbxNormalizeLegacyScanDir();\n  const pm=document.getElementById' not in text:
              if init_anchor not in text:
                  raise SystemExit('INIT_ANCHOR_NOT_FOUND')
              text = text.replace(init_anchor, init_replacement, 1)

          required = [
              "const APP_VERSION='v2.68';",
              "function _dbxNormalizeLegacyScanDir(){",
              "if(v===_DBX_OLD_ROOT+'/스캔함'){_lsDel(_K.SCAN_DIR);return;}",
              "navigator.share({title:'Receipt DB Dropbox 연결'",
              "복사가 막혔어요. 아래 링크를 길게 눌러 복사하거나 그대로 보내 주세요.",
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'MISSING_REQUIRED_PATCH: {needle}')

          if text == original:
              print('No index.html changes needed')
          else:
              path.write_text(text, encoding='utf-8')
          PY

      - name: Check patched JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S|re.I)
          Path('/tmp/receipt-db-scripts.js').write_text('\n;\n'.join(scripts), encoding='utf-8')
          print(f'Extracted {len(scripts)} script blocks')
          PY
          node --check /tmp/receipt-db-scripts.js

      - name: Commit patched app
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix: improve Dropbox reconnect and scan path migration"
          git push
