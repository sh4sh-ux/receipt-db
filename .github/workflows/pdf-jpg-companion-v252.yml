name: Apply PDF JPG companion support

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pdf-jpg-companion-v252.yml'
      - '.github/scripts/pdf_jpg_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/pdf_jpg_patch.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '_pdfFirstPageToJpegBlob' in s
          assert '_dbxRenamePdfJpgCompanion' in s
          assert "const _SCAN_DOC_EXTS=['.pdf'];" in s
          assert 'pdf.min.js' in s
          print('verification passed')
          PY
          git diff --check
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/pdf-jpg-companion-v252.yml .github/scripts/pdf_jpg_patch.py
          git diff --cached --check
          git commit -m "feat: create JPG companions for scanned PDFs"
          git push
